services:
  postgres:
    image: postgres:16
    container_name: teamwork-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamwork_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d teamwork_test']
      interval: 5s
      timeout: 5s
      retries: 10
