on:
    pull_request:
        types: [opened, synchronize, reopened]
jobs:
    lint-js:
        name: Ensure JavaScript/TypeScript was formatted
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            - run: npm run lint
    run-tests:
        name: Run tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: teamwork_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d teamwork_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DB_HOST: localhost
            DB_NAME: teamwork_test
            DB_USER: postgres
            DB_PASSWORD: postgres
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/teamwork_test
            JWT_SECRET: test-jwt-secret
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            - name: Run database migrations
              run: npm run migrate:up
            - run: npm test
